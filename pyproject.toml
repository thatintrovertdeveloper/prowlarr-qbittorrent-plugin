# Tooling configuration only: the plugin itself is distributed as a single
# file and imports nothing outside the Python standard library (plus the
# `socks` module bundled with qBittorrent, used by helpers.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py313"]
skip-string-normalization = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# Vendored qBittorrent files must stay byte-identical to upstream.
"helpers.py" = ["ALL"]
"novaprinter.py" = ["ALL"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
# Vendored qBittorrent helpers predate strict typing.
[[tool.mypy.overrides]]
module = ["helpers", "novaprinter"]
ignore_errors = true
